[package]
name = "solana-validator-ordering"
version = "0.1.0"
edition = "2021"
description = "Measure how Solana validators order transactions within blocks"
license = "MIT"

[dependencies]
# Solana SDK 2.1+ or lightweight crates
solana-sdk = "2.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for JSON-RPC
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
bincode = "1.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
rand = "0.8"

# Direct TPU QUIC transport (client side, no Agave internals required)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

[profile.release]
opt-level = 3
lto = true
strip = true
